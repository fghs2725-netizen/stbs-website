<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Offline · STBS Admin</title>
<style>
  :root { color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom));
    box-sizing: border-box; background: #f5f5f7; color: #1d1d1f;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  .card { width: 100%; max-width: 360px; padding: 32px 24px; border-radius: 18px; background: #fff; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { margin: 18px 0 6px; font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0; color: #6e6e73; font-size: .9375rem; }
  button {
    margin-top: 22px; width: 100%; min-height: 48px; border: 0; border-radius: 12px;
    background: #0B1F33; color: #fff; font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <main class="card">
    <img src="/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>STBS Admin needs a connection to show live quotations, invoices and enquiries. Check your signal and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
